    #btnAcceptLine { bottom:max(148px, calc(env(safe-area-inset-bottom) + 140px)); width:max-content; max-width:calc(100% - 24px); }
  }

  #btnMenu { background:#ffd23a; font-weight:800; }
  #btnRushStock { background:#b8283a; color:white; font-weight:800; }
  #restockCard { box-sizing:border-box; padding:8px; background:#fff5d6; color:#501214; border:2px solid #2f6b3a; border-radius:8px; font-size:13px; pointer-events:auto; }
  #hud #restockCard { order:3; flex:1 1 100%; max-width:430px; }
  #restockCard[hidden], #btnRushStock[hidden], #btnMenu[hidden] { display:none; }
  #restockCard .restock-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  #restockCard button { min-height:44px; margin:0; width:auto; padding:6px 10px; font-size:13px; }
  #restockCard small { display:block; }
  #menuBody button { width:auto; padding:8px; min-height:44px; margin:6px 3px 8px 0; font-size:14px; }
  #menuBody button[aria-pressed=true] { background:#ffd23a; }
  #menuBody p { margin-top:8px; }
  @media(max-width:430px) { #hud #btnMenu, #hud #btnRushStock { order:2; min-height:44px; flex:1 1 auto; } #hud #btnRushStock { flex-basis:100%; } }
  @media(prefers-reduced-motion:reduce) { #btnCrew.buy-ready, #btnManage.ready { animation:none; } }
</style>
